  <style>
    :root {
      --bg: #111111;
      --ink: #f2f2f2;
      --body: #c8c8c8;
      --muted: #8f8f8f;
      --faint: #888888;
      --hair: #2c2c2c;
      --mono: ui-monospace, "SF Mono", Consolas, "Roboto Mono", monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 13px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: var(--ink); text-decoration: none; font-weight: 700; border-bottom: 1px solid var(--ink); }
    a:hover { opacity: .6; box-shadow: 0 1px 0 0 var(--ink); }

    .shell { max-width: 780px; margin: 0 auto; padding: 36px 24px 64px; }
    .nav { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 11px; letter-spacing: .1em; margin-bottom: 20px; }
    .nav .cur { font-weight: 700; }

    .box { border: 1px solid var(--ink); padding: 18px 20px; background: #111111; }

    .sec { margin-top: 0; }
    .sec .sb { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); letter-spacing: .1em; margin-bottom: 12px; }
    .sec .sb b { color: var(--ink); font-weight: 700; letter-spacing: .14em; }
    .box p { margin: 0 0 10px; color: var(--body); }
    .box p:last-child { margin-bottom: 0; }

    .pub { display: grid; grid-template-columns: 46px minmax(0,1fr) 150px 160px; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--hair); align-items: baseline; }
    .pub:first-of-type { border-top: 1px solid var(--hair); }
    .pub .y { grid-column: 1; grid-row: 1; color: var(--muted); }
    .pub .ta { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .pub .t { font-weight: 700; color: var(--ink); }
    .pub .a { color: var(--muted); font-size: 11px; }
    .pub .a em { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
    .pub .a a.ca { color: inherit; font-weight: inherit; border-bottom: none; text-decoration: none; }
    .pub .a a.ca:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
    .pub .v { grid-column: 3; grid-row: 1; color: var(--muted); font-size: 12px; font-style: italic; }
    .pub .l { grid-column: 4; grid-row: 1; font-size: 12px; white-space: nowrap; }
    .sep { color: var(--faint); }
    .abs { font-weight: 700; border-bottom: 1px solid var(--ink); cursor: pointer; }
    .abs:hover { opacity: .6; box-shadow: 0 1px 0 0 var(--ink); }
    .pub-abs { display: none; padding: 10px 0 12px 58px; color: var(--body); font-size: 12px; }
    .pub-abs.open { display: block; }

    .more { margin-top: 12px; }

    @media (max-width: 640px) {
      .pub { grid-template-columns: 46px minmax(0,1fr); }
      .pub .y { grid-column: 1; grid-row: auto; }
      .pub .ta, .pub .v, .pub .l { grid-column: 2; grid-row: auto; }
    }
    .foot { margin-top: 36px; color: var(--muted); font-size: 11px; letter-spacing: 0.4px; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="nav">
      <a href="index.html">HOME</a>
      <span class="cur">PUBLICATIONS</span>
      <a href="cv.html">CV</a>
      <a href="code.html">CODE</a>
    </div>

    <div class="sec">
      <div class="sb"><b>[ PUBLICATIONS ]</b><span>01</span></div>
      <div class="box">
        <div data-list="pubs">
          <template data-item>
            <div class="pub">
              <span class="y">__YEAR__</span>
              <span class="ta">
                <span class="t">__TITLE__</span>
                <span class="a">__AUTHORS__</span>
              </span>
              <span class="v">__VENUE__</span>
              <span class="l"><span class="abs" role="button" tabindex="0" aria-expanded="false">Abs</span>__LINKS__</span>
            </div>
            <div class="pub-abs">__ABSTRACT__</div>
          </template>
        </div>
      </div>
    </div>

    <footer class="foot"><span data-slot="footer"></span>
  </div>

  <script>{% include variants-site-data.js %}</script>
