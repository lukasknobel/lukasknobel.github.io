  <style>
    :root {
      --bg: #111111;
      --ink: #f2f2f2;
      --body: #c8c8c8;
      --muted: #8f8f8f;
      --faint: #888888;
      --hair: #2c2c2c;
      --mono: ui-monospace, "SF Mono", Consolas, "Roboto Mono", monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 13px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: var(--ink); text-decoration: none; font-weight: 700; border-bottom: 1px solid var(--ink); }
    a:hover { opacity: .6; box-shadow: 0 1px 0 0 var(--ink); }

    .shell { max-width: 780px; margin: 0 auto; padding: 36px 24px 64px; }
    .nav { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 11px; letter-spacing: .1em; margin-bottom: 20px; }
    .nav .cur { font-weight: 700; }

    .sec { margin-top: 0; }
    .sec .sb { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); letter-spacing: .1em; margin-bottom: 12px; }
    .sec .sb b { color: var(--ink); font-weight: 700; letter-spacing: .14em; }

    .repos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .repo { min-width: 0; border: 1px solid var(--ink); background: #111111; padding: 14px 16px; }
    .repo .rname { font-size: 12px; overflow-wrap: anywhere; }
    .repo .rdesc { margin: 6px 0 0; color: var(--body); font-size: 12px; }
    .repo .rstats { display: none; margin: 6px 0 0; color: var(--faint); font-size: 11px; letter-spacing: .05em; }
    .repo .rstats.show { display: block; }

    .more { margin-top: 12px; }

    @media (max-width: 640px) {
      .repos { grid-template-columns: 1fr; }
    }
    .foot { margin-top: 36px; color: var(--muted); font-size: 11px; letter-spacing: 0.4px; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="nav">
      <a href="index.html">HOME</a>
      <a href="publications.html">PUBLICATIONS</a>
      <a href="cv.html">CV</a>
      <span class="cur">CODE</span>
    </div>

    <div class="sec">
      <div class="sb"><b>[ CODE ]</b><span>01</span></div>
      <div class="repos" data-list="repos">
        <template data-item>
          <div class="repo" data-repo="__SLUG__">
            <a class="rname" href="__URL__">__NAME__</a>
            <p class="rdesc">__DESC__</p>
            <p class="rstats"></p>
          </div>
        </template>
      </div>
      <p class="more">→ <a href="https://github.com/lukasknobel">github.com/lukasknobel</a></p>
    </div>
    <footer class="foot"><span data-slot="footer"></span>
  </div>

  <script>{% include variants-site-data.js %}</script>
