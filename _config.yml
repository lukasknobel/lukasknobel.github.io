# Minimal Jekyll config for the static personal-site template.
# Only two build plugins are needed:
#   - jekyll-imagemagick: generates responsive webp variants of assets/img/*
#   - jekyll-sitemap:     generates /sitemap.xml (referenced by robots.txt)
url: https://lukasknobel.github.io
baseurl: ""
title: "Lukas Knobel"
description: "PhD candidate in Fundamental AI - vision, video and self-supervised learning."

# Shared integrations. Set a value to "" to disable that integration.
# Add markup for other services in _includes/site-integrations.liquid.
integrations:
  google_site_verification: "GV7I79S9bYiKM3WF2Bn1OnAF85SOyY6NDSx35iEPdzI"
  cloudflare_web_analytics_token: "70a1b7f30e7c4bd1b6f7b1fa611f305f"

exclude:
  - bin/
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - Gemfile
  - Gemfile.lock
  - variants/

plugins:
  - jekyll-imagemagick
  - jekyll-sitemap

imagemagick:
  enabled: true
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
    - ".gif"
  output_formats:
    webp: "-auto-orient -quality 85"
